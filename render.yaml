services:
  - type: web
    name: maati-api
    runtime: node
    region: ohio
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: BACKBOARD_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: PREDICTOR_BASE_URL
        fromService:
          name: maati-predictor
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PREDICTOR_API_TOKEN
        fromService:
          name: maati-predictor
          type: web
          envVarKey: PREDICTOR_API_TOKEN

  - type: web
    name: maati-predictor
    runtime: python
    region: ohio
    rootDir: backend
    plan: free
    buildCommand: pip install -r ai/requirements-lite.txt
    startCommand: gunicorn --workers 1 --threads 1 --bind 0.0.0.0:$PORT ai.sklearn_predictor:app
    healthCheckPath: /healthz
    envVars:
      - key: PREDICTOR_API_TOKEN
        generateValue: true

  - type: web
    name: maati-web
    runtime: node
    region: ohio
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAATI_BACKEND_URL
        fromService:
          name: maati-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
